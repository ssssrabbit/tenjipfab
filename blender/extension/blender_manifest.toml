schema_version = "1.0.0"

id = "tenji_pfab"
version = "0.1.0"
name = "Tenji P-Fab:Japanese Braille"
tagline = "Project Japanese braille text onto 3D models"
maintainer = "Kaname Endo"
type = "add-on"

# Developed and tested on Blender 5.2.1 LTS only.
blender_version_min = "5.2.0"

website = "https://github.com/ssssrabbit/tenjipfab"

# extensions.blender.org requires GPL-3.0-or-later for add-ons. The bundled Janome (Apache-2.0) is compatible with GPL-3.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Kaname Endo"]

tags = ["Add Mesh"]

# Janome (pure Python, includes the IPAdic dictionary). Downloaded by tools/build_extension.py.
wheels = ["./wheels/Janome-0.5.0-py2.py3-none-any.whl"]

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".DS_Store"]
